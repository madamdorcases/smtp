# Pure SMTP relay — 24/7 operation on RocketVPS.
#
# Brings up:
#   - smtp-redis  : Redis (no persistence — queue is ephemeral)
#   - smtp-relay  : The SMTP server on ports 465 (implicit TLS) + 587 (STARTTLS)
#
# Both services use `restart: always` so they survive reboots and crashes.
# Let's Encrypt cert files are mounted read-only from the host.
#
# Usage:
#   cd /app  (or wherever you cloned the project on the VPS)
#   docker compose up -d --build
#   docker compose logs -f smtp-relay
#
# To stop:
#   docker compose down
#
# To rebuild after a code change:
#   docker compose up -d --build

services:
  smtp-redis:
    image: redis:7-alpine
    container_name: smtp-redis
    restart: always
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --bind 0.0.0.0
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    # No port published — only smtp-relay needs to reach Redis.
    # If you need to inspect Redis from the host, uncomment:
    # ports:
    #   - "127.0.0.1:6379:6379"
    networks:
      - smtp-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  smtp-relay:
    build: .
    image: smtp-relay:latest
    container_name: smtp-relay
    restart: always
    depends_on:
      smtp-redis:
        condition: service_healthy
    ports:
      # 465  — SMTP implicit TLS  (PRIMARY — what users connect to)
      # 587  — SMTP STARTTLS      (compatibility — firewall if unused)
      - "465:465"
      - "587:587"
      # NOTE: NO port 80, NO port 443, NO port 10000 — there is no HTTP service.
    volumes:
      # Let's Encrypt certs from the host (read-only)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # .env file from the host (so you can edit without rebuilding)
      - ./.env:/app/.env:ro
      # LOGS — written to /var/log/smtp-relay on the host (NOT inside the container).
      # The cleanup worker truncates log files every 15 min.
      - /var/log/smtp-relay:/var/log/smtp-relay
    env_file:
      - .env
    environment:
      # Override REDIS_URL to point at the smtp-redis service on the internal network
      REDIS_URL: "redis://smtp-redis:6379/0"
      # Tell the app where to write logs (inside the container; the volume mount
      # above makes this path appear on the host too)
      LOG_DIR: "/var/log/smtp-relay"
    networks:
      - smtp-internal
    healthcheck:
      # TCP probe on port 465 — if the SMTP server isn't accepting TLS connections,
      # Docker will restart the container.
      test: ["CMD-SHELL", "openssl s_client -connect 127.0.0.1:465 -quiet < /dev/null 2>&1 | grep -q '^220' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        # Container stdout logs — also bounded so Docker doesn't fill the disk.
        # The cleanup worker truncates the in-container log file every 15 min,
        # but Docker's own log driver is separate — these limits protect it.
        max-size: "10m"
        max-file: "3"

networks:
  smtp-internal:
    driver: bridge
